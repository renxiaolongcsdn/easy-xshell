name: Build macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-arm:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: |
          brew install openssl libssh2
          npm install

      - name: Build (ARM64)
        env:
          OPENSSL_DIR: /opt/homebrew/opt/openssl
          LIBSSH2_SYS_USE_PKG_CONFIG: "1"
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl/lib/pkgconfig
        run: npm run tauri build

      - name: List outputs
        run: |
          echo "=== DMG ==="
          find src-tauri/target/release/bundle -name "*.dmg" -exec ls -lh {} \;
          echo "=== APP ==="
          find src-tauri/target/release/bundle -name "*.app" -exec ls -lh {} \;

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: EasyXShell-macOS-ARM64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload APP
        uses: actions/upload-artifact@v4
        with:
          name: EasyXShell-macOS-APP
          path: |
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
